<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>

  <text x="400" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">Daily crawl: two passes over Past</text>
  <text x="400" y="56" font-size="13" text-anchor="middle" fill="#475569">the site filters by date, so each pass asks for a different window</text>

  <!-- pass bars -->
  <rect x="572" y="84" width="168" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="560" y="104" font-size="14" font-weight="bold" text-anchor="end" fill="#0f172a">Pass 1: Publication Date</text>
  <text x="560" y="121" font-size="12" text-anchor="end" fill="#475569">new, closed and cancelled tenders</text>
  <text x="656" y="111" font-size="13" text-anchor="middle" fill="#0f172a">last 90 days</text>

  <rect x="60" y="148" width="680" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="76" y="168" font-size="14" font-weight="bold" fill="#0f172a">Pass 2: Award Date</text>
  <text x="76" y="185" font-size="12" fill="#475569">awards posted long after the tender was published</text>
  <text x="656" y="175" font-size="13" text-anchor="middle" fill="#0f172a">last 365 days</text>

  <!-- axis -->
  <line x1="60" y1="250" x2="750" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <g stroke="#475569" stroke-width="2">
    <line x1="60" y1="244" x2="60" y2="256"/>
    <line x1="572" y1="244" x2="572" y2="256"/>
    <line x1="740" y1="244" x2="740" y2="256"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="60" y="274">365 days ago</text>
    <text x="572" y="274">90 days ago</text>
    <text x="740" y="274">today</text>
  </g>

  <!-- example tender -->
  <line x1="367" y1="250" x2="516" y2="250" stroke="#22c55e" stroke-width="4"/>
  <circle cx="367" cy="250" r="7" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <circle cx="516" cy="250" r="7" fill="#22c55e"/>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="367" y="232">published</text>
    <text x="516" y="232">awarded</text>
  </g>
  <rect x="200" y="296" width="400" height="58" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="400" y="320" font-size="13" text-anchor="middle" fill="#0f172a">Published 200 days ago: outside pass 1.</text>
  <text x="400" y="340" font-size="13" text-anchor="middle" fill="#0f172a">Its Award Date is in pass 2, so the award is collected.</text>

  <text x="400" y="384" font-size="12" text-anchor="middle" fill="#64748b">53% of 1,862 awards were posted more than 90 days after publication</text>
</svg>
