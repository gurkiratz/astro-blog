<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>

  <g text-anchor="middle" fill="#0f172a">
    <rect x="170" y="30" width="300" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="320" y="54" font-size="15" font-weight="bold">Free-text cell</text>
    <text x="320" y="73" font-size="12" fill="#475569">supplier, buyer address or contact</text>

    <rect x="170" y="124" width="300" height="54" rx="8" fill="#ffffff" stroke="#22c55e" stroke-dasharray="5 4"/>
    <text x="320" y="148" font-size="15" font-weight="bold">Answer in cache?</text>
    <text x="320" y="167" font-size="12" fill="#475569">key: model + prompt + cell text</text>

    <rect x="540" y="124" width="230" height="54" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="655" y="148" font-size="15" font-weight="bold">GPT (gpt-4.1-mini)</text>
    <text x="655" y="167" font-size="12" fill="#475569">temperature 0, fixed schema</text>

    <rect x="170" y="218" width="300" height="54" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="320" y="242" font-size="15" font-weight="bold">Answer</text>
    <text x="320" y="261" font-size="12" fill="#475569">names, addresses, amounts</text>

    <rect x="170" y="312" width="300" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="320" y="336" font-size="15" font-weight="bold">Every value in the cell?</text>
    <text x="320" y="355" font-size="12" fill="#475569">compared after normalization</text>

    <rect x="60" y="420" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="170" y="452" font-size="15" font-weight="bold">Use the answer</text>

    <rect x="360" y="420" width="220" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="470" y="452" font-size="15" font-weight="bold">Use the regex result</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="320" y1="84" x2="320" y2="122" marker-end="url(#arrow)"/>
    <line x1="470" y1="151" x2="538" y2="151" marker-end="url(#arrow)"/>
    <line x1="320" y1="178" x2="320" y2="216" marker-end="url(#arrow)"/>
    <polyline points="655,178 655,245 472,245" marker-end="url(#arrow)"/>
    <line x1="320" y1="272" x2="320" y2="310" marker-end="url(#arrow)"/>
    <polyline points="320,366 320,392 170,392 170,418" marker-end="url(#arrow)"/>
    <polyline points="320,392 470,392 470,418" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#475569">
    <text x="486" y="144">no</text>
    <text x="330" y="202">yes</text>
    <text x="664" y="214">saved to cache (S3)</text>
    <text x="180" y="410">yes</text>
    <text x="480" y="410">no</text>
  </g>
</svg>
